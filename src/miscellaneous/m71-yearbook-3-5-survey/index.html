<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>クラス印象アンケート</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
      :root {
        --paper: #f6f1e6;
        --paper-line: #dcd2bb;
        --ink: #23282e;
        --ink-soft: #5b5647;
        --stamp: #b23a2e;
        --stamp-soft: #e9d9ce;
        --ok: #55684a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "Zen Kaku Gothic New", sans-serif;
        line-height: 1.7;
        min-height: 100vh;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }
      header.page-head {
        border-bottom: 1px solid var(--paper-line);
        padding-bottom: 20px;
        margin-bottom: 32px;
      }
      h1 {
        font-family: "Shippori Mincho", serif;
        font-weight: 700;
        font-size: 26px;
        margin: 0 0 10px;
        letter-spacing: 0.02em;
      }
      .lead {
        color: var(--ink-soft);
        font-size: 14.5px;
        margin: 0;
      }
      .lead b {
        color: var(--ink);
        font-weight: 700;
      }

      #status-area {
        padding: 60px 0;
        text-align: center;
        color: var(--ink-soft);
        font-size: 14px;
      }

      .card {
        background: #fff;
        border: 1px solid var(--paper-line);
        border-radius: 2px;
        padding: 26px 22px;
        margin-bottom: 22px;
      }
      .card-head {
        display: flex;
        align-items: baseline;
        gap: 14px;
        margin-bottom: 18px;
        border-bottom: 1px dashed var(--paper-line);
        padding-bottom: 14px;
      }
      .badge {
        font-family: "Shippori Mincho", serif;
        font-weight: 700;
        font-size: 15px;
        color: var(--stamp);
        background: var(--stamp-soft);
        border-radius: 2px;
        padding: 4px 10px;
        white-space: nowrap;
      }
      .badge .num {
        font-size: 22px;
        margin-left: 2px;
      }
      .card-head p {
        margin: 0;
        font-size: 13px;
        color: var(--ink-soft);
      }

      label {
        display: block;
        font-size: 13.5px;
        font-weight: 700;
        margin: 16px 0 6px;
      }
      label:first-of-type {
        margin-top: 0;
      }
      textarea,
      input[type="text"] {
        width: 100%;
        font-family: inherit;
        font-size: 14.5px;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--paper-line);
        border-radius: 2px;
        padding: 10px 12px;
        resize: vertical;
      }
      textarea {
        min-height: 64px;
      }
      textarea:focus,
      input:focus {
        outline: 2px solid var(--stamp);
        outline-offset: -1px;
      }

      .submit-row {
        margin-top: 34px;
        text-align: center;
      }
      button {
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        background: var(--stamp);
        border: none;
        border-radius: 2px;
        padding: 13px 40px;
        cursor: pointer;
      }
      button:disabled {
        background: #b9afa0;
        cursor: not-allowed;
      }
      button:not(:disabled):hover {
        filter: brightness(1.06);
      }
      .error {
        color: var(--stamp);
        font-size: 13px;
        margin-top: 12px;
        text-align: center;
      }

      .done {
        text-align: center;
        padding: 70px 20px;
      }
      .done .mark {
        font-family: "Shippori Mincho", serif;
        font-size: 40px;
        color: var(--ok);
        margin-bottom: 14px;
      }
      .done p {
        color: var(--ink-soft);
        font-size: 14px;
      }

      @media (prefers-reduced-motion: no-preference) {
        .card {
          animation: rise 0.35s ease both;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="page-head">
        <h1>クラス印象アンケート</h1>
        <p class="lead">
          あなたには
          <b>3人分</b>
          の番号がランダムに割り当てられます。それぞれについて、印象を教えてください。
        </p>
      </header>

      <div id="status-area">読み込み中…</div>
      <form id="survey-form" style="display: none"></form>
      <div id="done-area" style="display: none" class="done">
        <div class="mark">送信完了</div>
        <p>回答ありがとうございました。</p>
      </div>
    </div>

    <script>
      /* ============================================================
       * Supabase 設定（あとで入れる）
       * ============================================================ */
      const SUPABASE_URL = "https://tfrjwtnbocctalnmgmyt.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRmcmp3dG5ib2NjdGFsbm1nbXl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MDUzMjIsImV4cCI6MjEwNDA4MTMyMn0.JibF1FD0t-qAe-WQ4V-uAsySP_8uL7YW31Du_tyqT38";

      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      /* ============================================================
       * 質問構成（ここを編集してカスタマイズしてください）
       * type: "text" (一行) / "textarea" (複数行)
       * ============================================================ */
      const QUESTIONS = [
        {
          id: "impression",
          type: "textarea",
          label: "この人の印象を教えてください",
          required: true,
        },
        {
          id: "goodpoint",
          type: "textarea",
          label: "良いところ・すごいと思うところ",
          required: false,
        },
        {
          id: "message",
          type: "text",
          label: "一言メッセージ",
          required: false,
        },
      ];

      const RESPONDENT_KEY = "impression_survey_respondent_id";

      function getRespondentId() {
        let id = localStorage.getItem(RESPONDENT_KEY);
        if (!id) {
          id = crypto.randomUUID();
          localStorage.setItem(RESPONDENT_KEY, id);
        }
        return id;
      }

      function fieldHtml(number, q) {
        const name = `n${number}_${q.id}`;
        const tag =
          q.type === "textarea"
            ? `<textarea name="${name}" ${q.required ? "required" : ""}></textarea>`
            : `<input type="text" name="${name}" ${q.required ? "required" : ""}>`;
        return `<label for="${name}">${q.label}${q.required ? "" : "（任意）"}</label>${tag}`;
      }

      function cardHtml(number, index) {
        return `
    <section class="card" data-number="${number}">
      <div class="card-head">
        <span class="badge">番号<span class="num">${number}</span></span>
        <p>${index + 1} / 3人目</p>
      </div>
      ${QUESTIONS.map((q) => fieldHtml(number, q)).join("")}
    </section>
  `;
      }

      async function init() {
        const statusArea = document.getElementById("status-area");
        const form = document.getElementById("survey-form");

        const respondentId = getRespondentId();

        const { data: numbers, error } = await supabaseClient.rpc(
          "assign_numbers",
          {
            p_respondent_id: respondentId,
          },
        );

        if (error) {
          statusArea.textContent =
            "読み込みに失敗しました。時間をおいて再度お試しください。";
          console.error(error);
          return;
        }

        statusArea.style.display = "none";
        form.style.display = "block";
        form.innerHTML =
          numbers.map((n, i) => cardHtml(n, i)).join("") +
          `<div class="submit-row">
       <button type="submit">回答を送信する</button>
       <div class="error" id="submit-error" style="display:none;"></div>
     </div>`;

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const submitBtn = form.querySelector("button[type=submit]");
          const errorBox = document.getElementById("submit-error");
          submitBtn.disabled = true;
          errorBox.style.display = "none";

          try {
            for (const n of numbers) {
              const answers = {};
              QUESTIONS.forEach((q) => {
                answers[q.id] = form.elements[`n${n}_${q.id}`].value.trim();
              });
              const { error: submitErr } = await supabaseClient.rpc(
                "submit_response",
                {
                  p_respondent_id: respondentId,
                  p_target_number: n,
                  p_answers: answers,
                },
              );
              if (submitErr) throw submitErr;
            }
            form.style.display = "none";
            document.getElementById("done-area").style.display = "block";
          } catch (err) {
            console.error(err);
            errorBox.textContent =
              "送信に失敗しました。もう一度お試しください。";
            errorBox.style.display = "block";
            submitBtn.disabled = false;
          }
        });
      }

      init();
    </script>
  </body>
</html>
